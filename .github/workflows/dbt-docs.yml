name: Publish dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dbt-docs-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Generate dbt docs without a warehouse connection
        run: uv run dbt docs generate --project-dir aws_snowflake_project --profiles-dir .github/dbt-docs --target docs --no-compile --empty-catalog
      - name: Prepare site
        run: |
          mkdir -p public
          cp aws_snowflake_project/target/{index.html,manifest.json,catalog.json} public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4